<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steepmap</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1720; color: #eef3f7;
    font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #93a3b2; margin: 0 0 20px; max-width: 30em; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 18px; background: #7fd3ff; color: #0f1720; }
</style>
</head>
<body>
  <div>
    <h1>Steepmap needs a connection once</h1>
    <p>Open the app with signal the first time so it can save the map to your phone. After that it works anywhere, with or without signal.</p>
    <button onclick="location.href='https://steepmap.ca/'">Try again</button>
  </div>
</body>
</html>
